# Tell Grafana to load any dashboard JSON found in the mounted folder.
apiVersion: 1

providers:
  - name: "Argus"
    orgId: 1
    folder: "Argus"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Matches the volume mount in docker-compose.yml.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
